name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject API key and build index.html
        env:
          GMAPS_KEY: ${{ secrets.GMAPS_KEY }}
        run: |
          if [ -z "$GMAPS_KEY" ]; then
            echo "Missing GMAPS_KEY repository secret" >&2
            exit 1
          fi
          mkdir -p dist
          sed "s/__GMAPS_KEY__/$GMAPS_KEY/g" milano-trip.html > dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
